<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4 py-12 relative overflow-hidden" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #030712; padding: 2rem 1rem;">
  <!-- Ambient background glow effects -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none" style="position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); width: 24rem; height: 24rem; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%); border-radius: 9999px; pointer-events: none;"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-purple-600/15 rounded-full blur-3xl pointer-events-none" style="position: absolute; bottom: 25%; right: 25%; width: 20rem; height: 20rem; background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%); border-radius: 9999px; pointer-events: none;"></div>

  <div class="max-w-md w-full bg-slate-900/90 rounded-2xl shadow-2xl p-8 sm:p-10 border border-slate-800/80 backdrop-blur-xl relative z-10" style="max-width: 28rem; width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(51, 65, 85, 0.8); border-radius: 1.25rem; padding: 2.5rem 2rem; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7); position: relative; z-index: 10;">
    
    <div class="text-center mb-8" style="text-align: center; margin-bottom: 2rem;">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg shadow-blue-500/25 mb-4" style="display: inline-flex; align-items: center; justify-content: center; width: 3.5rem; height: 3.5rem; border-radius: 1rem; background: linear-gradient(135deg, #2563eb, #6366f1); color: #fff; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35); margin-bottom: 1rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px; display: block;">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight" style="font-size: 1.5rem; font-weight: 700; color: #ffffff; margin: 0 0 0.5rem 0; letter-spacing: -0.025em;">Admin Portal</h2>
      <p class="text-sm text-slate-400" style="font-size: 0.875rem; color: #94a3b8; margin: 0;">Sign in to manage your portfolio content</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 0.5rem;">Email Address</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-slate-500 text-sm transition-all outline-none"
          style="width: 100%; box-sizing: border-box; padding: 0.85rem 1rem; background-color: #030712; border: 1.5px solid #1e293b; border-radius: 0.75rem; color: #ffffff; font-size: 0.875rem; outline: none; transition: border-color 0.2s;"
          placeholder="admin@example.com"
        >
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" style="color: #f87171; font-size: 0.75rem; margin-top: 0.35rem;">
          Email is required.
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']" style="color: #f87171; font-size: 0.75rem; margin-top: 0.35rem;">
          Please enter a valid email address.
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2" style="display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 0.5rem;">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-slate-500 text-sm transition-all outline-none"
          style="width: 100%; box-sizing: border-box; padding: 0.85rem 1rem; background-color: #030712; border: 1.5px solid #1e293b; border-radius: 0.75rem; color: #ffffff; font-size: 0.875rem; outline: none; transition: border-color 0.2s;"
          placeholder="••••••••"
        >
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" style="color: #f87171; font-size: 0.75rem; margin-top: 0.35rem;">
          Password is required.
        </div>
      </div>

      <div *ngIf="error" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 0.75rem; padding: 0.75rem 1rem; text-align: center; color: #f87171; font-size: 0.875rem;">
        {{ error }}
      </div>

      <button 
        type="submit" 
        [disabled]="loading"
        class="w-full py-3.5 px-4 rounded-xl text-sm font-semibold text-white bg-blue-600 hover:bg-blue-500 active:bg-blue-700 shadow-lg shadow-blue-600/30 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all cursor-pointer mt-2"
        style="width: 100%; padding: 0.9rem 1rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; color: #ffffff; background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); transition: all 0.2s; margin-top: 0.5rem;"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
          <svg style="width: 16px; height: 16px; animation: spin 1s linear infinite;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle opacity="0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path opacity="0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Authenticating...
        </span>
      </button>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.75rem; color: #64748b;">
      Portfolio Admin &bull; Secure Authentication &bull; JWT Protected
    </div>
  </div>
</div>
