<header id="header">
  <div class="hdr-left">
    <button class="hamburger" (click)="toggleSidebar.emit()" title="Toggle Sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="page-title">{{ pageTitle }}</span>
  </div>

  <div class="hdr-search-wrap">
    <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="hdr-search" type="text" placeholder="Search projects, articles, inquiries..."/>  
  </div>

  <div class="hdr-right">
    <!-- Light / Dark Mode Toggle Button -->
    <button 
      class="theme-toggle-btn" 
      (click)="toggleTheme()" 
      [title]="themeService.currentTheme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <!-- Sun icon (shown in dark mode) -->
      <svg *ngIf="themeService.currentTheme() === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon icon (shown in light mode) -->
      <svg *ngIf="themeService.currentTheme() === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <a href="http://127.0.0.1:5500/portfolio-main/index.html" target="_blank" rel="noopener noreferrer" class="live-link-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      <span>Live Portfolio</span>
    </a>

    <div style="position: relative;" *ngIf="authService.currentUser$ | async as user">
      <div class="prof-btn" (click)="toggleProfile()">
        <div class="prof-av">
          {{ user.fullName ? user.fullName[0] : (user.email ? user.email[0].toUpperCase() : 'A') }}
        </div>
        <span class="prof-name">{{ user.fullName || user.email }}</span>
        <svg width="14" height="14" style="color: var(--muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>

      <div class="dd-menu" [class.open]="isProfileOpen()">
        <div style="padding: 8px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px;">
          <div style="font-size: 13px; font-weight: 700; color: var(--text);">{{ user.fullName }}</div>
          <div style="font-size: 11px; color: var(--muted);">{{ user.email }}</div>
        </div>
        <div class="dd-item" (click)="router.navigate(['/profile']); isProfileOpen.set(false)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile Settings</span>
        </div>
        <div class="dd-divider"></div>
        <div class="dd-item danger" (click)="signOut()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sign Out</span>
        </div>
      </div>
    </div>
  </div>
</header>
